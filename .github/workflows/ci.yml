name: TypeNative UI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out framework
        uses: actions/checkout@v4
      - name: Check out pinned TypeNative compiler
        uses: actions/checkout@v4
        with:
          repository: Ohanronnie/typenative
          ref: 3ef10d4579e1c0765ad56fe787db37b9bdcb4c1a
          path: .compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build TypeNative compiler
        working-directory: .compiler
        run: cargo build --release -p tn-cli
      - name: Verify compiler boundary
        run: scripts/verify-compiler-boundary.sh .compiler
      - name: Build pinned Yoga
        run: scripts/check-yoga.sh
      - name: Check formatting
        run: .compiler/target/release/tn fmt --check .
      - name: Check TypeNative sources
        run: .compiler/target/release/tn check
      - name: Run framework verification
        run: scripts/run-tests.sh .compiler/target/release/tn
