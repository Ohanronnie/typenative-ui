name: TypeNative UI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out framework
        uses: actions/checkout@v4
      - name: Check out pinned TypeNative compiler
        uses: actions/checkout@v4
        with:
          repository: Ohanronnie/typenative
          ref: 3097695b871d230b40635e71129a5407c395d6bc
          path: .compiler
      - name: Install LLVM 22.1.8
        run: |
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          test "$("$llvm_prefix/bin/llvm-config" --version)" = "22.1.8"
          echo "LLVM_SYS_221_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build TypeNative compiler
        working-directory: .compiler
        run: cargo build --release -p tn-cli
      - name: Verify compiler boundary
        run: sh scripts/verify-compiler-boundary.sh .compiler
      - name: Build pinned Yoga
        run: sh scripts/check-yoga.sh
      - name: Check formatting
        run: .compiler/target/release/tn fmt --check src examples testing benchmarks
      - name: Check TypeNative sources
        run: .compiler/target/release/tn check typenative.json
      - name: Verify clean clone
        run: sh scripts/verify-clean-clone.sh .compiler/target/release/tn
      - name: Run framework verification
        run: scripts/run-tests.sh .compiler/target/release/tn
